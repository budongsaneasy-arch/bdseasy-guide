# ─────────────────────────────────────────────────────────────
#  이 파일은 "배포하라고 했을 때만 사이트를 다시 만드는" 설정입니다.
#  문서를 고쳐 저장(커밋)하는 것만으로는 사이트가 바뀌지 않습니다.
#
#  배포하는 방법은 두 가지입니다.
#   1. Claude에게 "배포해줘"라고 말씀하시면 deploy-날짜-순번 태그를
#      붙여 올리고, 1~2분 뒤 사이트에 반영됩니다.
#   2. GitHub 저장소 Actions → "가이드 사이트 배포" → Run workflow
#      버튼을 직접 누르셔도 됩니다.
#
#  ★ 대표님이 손대실 곳은 없습니다. 그냥 두세요.
#  ★ GitHub 저장소 Settings → Pages → Source 를 "GitHub Actions" 로
#    한 번만 바꿔주시면 동작합니다.
#  ★ Settings → Environments → github-pages → Deployment branches and tags
#    에 태그 규칙 deploy-* 를 한 번 추가해야 합니다. (기본값은 main
#    브랜치만 허용이라, 빠뜨리면 태그 배포가 거부됩니다)
# ─────────────────────────────────────────────────────────────
name: 가이드 사이트 배포

on:
  push:
    tags: ['deploy-*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4
        with:
          # 문서마다 "최종 수정일"을 자동으로 붙이려면 전체 이력이 필요합니다.
          fetch-depth: 0

      - name: main에 들어 있는 내용인지 확인
        # main에 합쳐지지 않은 커밋에 태그가 붙으면 배포를 멈춥니다.
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::이 커밋은 main에 들어 있지 않습니다. main의 커밋에 태그를 붙여 주세요."
            exit 1
          fi

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 패키지 설치
        run: npm install

      - name: 사이트 만들기
        run: npm run build

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 결과물 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 공개하기
        id: deployment
        uses: actions/deploy-pages@v4
